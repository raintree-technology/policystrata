version: brownfield-cube-v1
principals:
  cube_admin_reviewer:
    id: cube_admin_reviewer
    role: admin_group
    tenant_ids:
    - cube_brownfield_scope
  cube_common_viewer:
    id: cube_common_viewer
    role: common_group
    tenant_ids:
    - cube_brownfield_scope
roles:
  admin_group:
    allowed_metrics:
    - count
    allowed_dimensions:
    - status
    allowed_time_ranges:
    - all_time
    max_rows: 5000
    max_cost: 5000
    aggregate_only: false
  common_group:
    allowed_metrics:
    - count
    allowed_dimensions:
    - status
    allowed_time_ranges:
    - all_time
    max_rows: 5000
    max_cost: 5000
    aggregate_only: false
metrics:
  count:
    expression: count(id)
    table: orders
    columns:
    - id
    allowed_roles:
    - admin_group
    - common_group
    aliases: []
    grain: row
    cost: 5
dimensions:
  id:
    column: orders.id
    allowed_roles:
    - admin_group
    - common_group
    sensitive: false
    cost: 1
  user_id:
    column: orders.user_id
    allowed_roles:
    - admin_group
    - common_group
    sensitive: false
    cost: 1
  status:
    column: orders.status
    allowed_roles:
    - admin_group
    - common_group
    sensitive: false
    cost: 1
  created_at:
    column: orders.created_at
    allowed_roles:
    - admin_group
    - common_group
    sensitive: false
    cost: 1
  completed_at:
    column: orders.completed_at
    allowed_roles:
    - admin_group
    - common_group
    sensitive: false
    cost: 1
