version: 1
domain: brownfield_wrenai
domain_path: domain
output: scan-out
dbt:
  files:
    - semantic_models.yml
sql_traces:
  required: true
  files:
    - traces.jsonl
tenancy:
  # Rendered from the customer model's native rule1 condition in
  # core/wren-core-base/tests/data/mdl.json ("c_custkey = @session_id"), substituting MDL's
  # @session_id session-property token for PolicyStrata's :principal.tenant_id placeholder. See
  # scripts/brownfield-transform-wrenai.py and transform_report.json.
  canonical_predicates:
    - "c_custkey = :principal.tenant_id"
fuzz:
  enabled: true
  seed: 1729
  max_cases_per_trace: 8
gate:
  fail_on_high_confidence: true
  required_inputs: [dbt, sql_traces]
