min_version = "2026.7.1"

[tools]
bun = "1.3.11"
node = "24.18.0"
python = ["3.12.13", "3.10.20", "3.11.15"]

[settings]
lockfile = true

[tasks.setup]
description = "Install dependencies"
run = "bun install --frozen-lockfile"

[tasks.lint]
description = "Run lint when available"
run = '''
if node -e "process.exit(require('./package.json').scripts?."lint" ? 0 : 78)"; then
  bun run lint
else
  code=$?
  if [ "$code" = "78" ]; then
    echo "No lint script; skipping"
  else
    exit "$code"
  fi
fi
'''

[tasks.typecheck]
description = "Run typecheck when available"
run = '''
if node -e "process.exit(require('./package.json').scripts?."typecheck" ? 0 : 78)"; then
  bun run typecheck
else
  code=$?
  if [ "$code" = "78" ]; then
    echo "No typecheck script; skipping"
  else
    exit "$code"
  fi
fi
'''

[tasks.test]
description = "Run tests when available"
run = '''
if node -e "process.exit(require('./package.json').scripts?."test" ? 0 : 78)"; then
  bun run test
else
  code=$?
  if [ "$code" = "78" ]; then
    echo "No test script; skipping"
  else
    exit "$code"
  fi
fi
'''

[tasks.validate]
description = "Run repo validation"
run = '''
if node -e "process.exit(require('./package.json').scripts?.validate ? 0 : 78)"; then
  bun run validate
else
  code=$?
  if [ "$code" = "78" ]; then
    mise run lint
    mise run typecheck
    mise run test
  else
    exit "$code"
  fi
fi
'''
