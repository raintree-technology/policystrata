name: CI

env:
  MISE_LOCKED: "1"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.20", "3.11.15", "3.12.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.7.1
          install: true
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-suffix: py-${{ matrix.python-version }}

      - name: Install dependencies
        run: mise x python@${{ matrix.python-version }} -- uv sync --extra dev

      - name: Run tests
        run: mise x python@${{ matrix.python-version }} -- uv run pytest

      - name: Run release checks
        if: ${{ matrix.python-version == '3.12.13' }}
        run: |
          mise x python@${{ matrix.python-version }} -- uv run ruff check .
          mise x python@${{ matrix.python-version }} -- uv run mypy src
          mise x python@${{ matrix.python-version }} node@24.18.0 -- node scripts/release-smoke.mjs --python-artifact

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_postgres }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policystrata
          POSTGRES_PASSWORD: policystrata
          POSTGRES_DB: support_saas
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U policystrata -d support_saas"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.7.1
          install: true
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-suffix: postgres-py-3.12

      - name: Install dependencies
        run: mise x python@3.12.13 -- uv sync --extra dev

      - name: Run PostgreSQL integration tests
        env:
          POLICYSTRATA_RUN_DB_TESTS: "1"
        run: mise x python@3.12.13 -- uv run pytest tests/test_postgres_integration.py

      - name: Run real-db scanner fixture
        run: >
          mise x python@3.12.13 -- uv run policystrata scan
          --config examples/postgres_dbt/policystrata_real_db_clean.yaml
          --out runs/scan-real-db-clean

  github-action:
    name: GitHub Action smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run local PolicyStrata action
        uses: ./
        with:
          config: examples/postgres_dbt/policystrata_clean.yaml
          out: runs/action-smoke

  node-sdk:
    name: Node packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
        with:
          version: 2026.7.1
          install: true
          cache: true

      - name: Install package dependencies
        run: mise x node@24.18.0 bun@1.3.11 -- bun install --frozen-lockfile

      - name: Run Node SDK tests
        working-directory: packages/node
        run: mise x node@24.18.0 bun@1.3.11 -- bun run test

      - name: Verify Node SDK package contents
        working-directory: packages/node
        run: mise x node@24.18.0 bun@1.3.11 -- bun pm pack --dry-run

      - name: Run Gateway tests
        working-directory: packages/gateway
        run: mise x node@24.18.0 bun@1.3.11 -- bun run test

      - name: Verify Gateway package contents
        working-directory: packages/gateway
        run: mise x node@24.18.0 bun@1.3.11 -- bun pm pack --dry-run

      - name: Clean-install packed Node artifacts
        run: mise x node@24.18.0 bun@1.3.11 -- node scripts/release-smoke.mjs --npm-artifacts
