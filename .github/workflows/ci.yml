name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_postgres:
        description: "Run Dockerized PostgreSQL integration tests"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.20", "3.11.15", "3.12.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-suffix: py-${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Run release checks
        if: ${{ matrix.python-version == '3.12.13' }}
        run: |
          uv run ruff check .
          uv run mypy src
          node scripts/release-smoke.mjs --python-artifact

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_postgres }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: policystrata
          POSTGRES_PASSWORD: policystrata
          POSTGRES_DB: support_saas
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U policystrata -d support_saas"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          enable-cache: true
          cache-suffix: postgres-py-3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run PostgreSQL integration tests
        env:
          POLICYSTRATA_RUN_DB_TESTS: "1"
        run: uv run pytest tests/test_postgres_integration.py

      - name: Run real-db scanner fixture
        run: >
          uv run policystrata scan
          --config examples/postgres_dbt/policystrata_real_db_clean.yaml
          --out runs/scan-real-db-clean

  github-action:
    name: GitHub Action smoke test
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Run local PolicyStrata action
        uses: ./
        with:
          config: examples/postgres_dbt/policystrata_clean.yaml
          out: runs/action-smoke

  node-sdk:
    name: Node packages
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.11"

      - name: Install package dependencies
        run: bun install --frozen-lockfile

      - name: Run Node SDK tests
        working-directory: packages/node
        run: bun run test

      - name: Verify Node SDK package contents
        working-directory: packages/node
        run: bun pm pack --dry-run

      - name: Run Gateway tests
        working-directory: packages/gateway
        run: bun run test

      - name: Verify Gateway package contents
        working-directory: packages/gateway
        run: bun pm pack --dry-run

      - name: Clean-install packed Node artifacts
        run: node scripts/release-smoke.mjs --npm-artifacts
