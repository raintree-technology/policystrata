schema_version: 1
target: betteroff.finance
study_kind: deployed-repository revision replay
notes:
  - The source repository is private and independently versioned from PolicyStrata.
  - Each probe searches exact Git objects. It does not execute the historical production service.
  - Mapped cases fit the v1 fault taxonomy; outside-v1 cases are reported rather than dropped.

cases:
  - id: betteroff-household-accounts-missing-rls
    before_revision: 7e37789655c5a439281f9e334de5d325daf4c319
    after_revision: 115587e8b7f63f9702ec0c59e528ea041b3dc0a6
    surface: database
    witness_class: over_permissive
    taxonomy_operator: app_deny_missing_db_policy
    taxonomy_status: mapped
    probe:
      pattern: 'ALTER TABLE "?household_accounts"? (ENABLE|FORCE) ROW LEVEL SECURITY'
      paths:
        - apps/app/drizzle
        - packages/db/rls

  - id: betteroff-transaction-tags-missing-rls
    before_revision: dbfc3991dd069ed0b9cf6ce0f166cb1b715298ce
    after_revision: db49b79864624f1ab7fd2398842d6f5bf22b71d1
    surface: database
    witness_class: over_permissive
    taxonomy_operator: app_deny_missing_db_policy
    taxonomy_status: mapped
    probe:
      pattern: 'ALTER TABLE "?transaction_tags"? (ENABLE|FORCE) ROW LEVEL SECURITY'
      paths:
        - apps/app/drizzle
        - packages/db/rls

  - id: betteroff-pdf-export-missing-audit-chokepoint
    before_revision: 68073dd45c1a25a4ad5cd47f88943f8c447c3e06
    after_revision: 9949cd069d4c324fb8f675cb96b187835ad36ce4
    surface: release
    witness_class: observability
    taxonomy_operator:
    taxonomy_status: outside_v1
    probe:
      pattern: 'auditExport'
      paths:
        - apps/app/app/api/export
        - apps/app/features/exports
