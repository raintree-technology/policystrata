  # "was not propagated into the database policy" -- database RLS in
  # schema.sql only implements tenant isolation, never metric/column-level
  # authorization, so there is no database-level backstop for a
  # metric-authorization gap the way there is for tenant scope. If this
  # gap is exploitable, the database is the surface with the gap and
  # nothing downstream is positioned to contain a metric-level (as opposed
  # to row-level) authorization failure. High confidence.
