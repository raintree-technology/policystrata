  # ---------------------------------------------------------------------
  # Operator: compiler_swaps_tenant_account_id
  # Contract reading is genuinely UNCERTAIN on two axes:
  #   (a) tasks/seeded.yaml has no example of this operator, so the
  #       compiler: v5 version override below is a guess by analogy with
  #       the other two tenant-scope compiler operators (v5), not a known
  #       wiring fact.
  #   (b) it is unclear from the description alone ("binds the tenant-scope
  #       obligation to account IDs instead of tenant IDs") whether this
  #       actually produces cross-tenant row exposure (if account ids are
  #       filtered to the requesting principal's own accounts, this could
  #       just be a scoping/undercount bug with no cross-tenant leak at
  #       all, i.e. arguably semantic_drift rather than lowering_violation)
  #       or a true tenant-boundary violation. We pick lowering_violation
  #       because "tenant/account scope confusion" is explicitly listed
  #       under lowering_violation in docs/failure-taxonomy.md, and we
  #       keep containment_layer: database by analogy with the other two
  #       tenant-key compiler bugs, but confidence here is low.
  # ---------------------------------------------------------------------
  - id: sb-compiler-swapid-01
    domain: support_saas
    principal: acme_analyst
    request: "Show ticket count by region for last month, after the account-scope refactor."
    policy_version: v7
    surface_versions: {manifest: v7, grammar: v7, validator: v7, compiler: v5, database: v7, release: v7}
    mutation: compiler_swaps_tenant_account_id
    semantic_query: {metric: ticket_count, dimensions: [region], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: lowering_violation
    expected_localized_surface: compiler
    expected_containment_layer: database  # UNCERTAIN, see comment above

  - id: sb-compiler-swapid-02
    domain: support_saas
    principal: acme_analyst
    request: "Show escalations by plan for last month, after the account-scope refactor."
    policy_version: v7
