  # ---------------------------------------------------------------------
  # Operator: validator_omits_sensitive_column
  # Contract reading: this time the bug is IN the validator itself (the
  # single layer the contract names as authoritative for dimension
  # authorization). No other surface's declared responsibility covers
  # dimension-level sensitivity (compiler preserves semantics, database
  # only does tenant-row isolation, release only withholds based on an
  # authorization_decision it is handed). So a buggy validator (v6) here
  # should leak all the way to release with nothing downstream to catch it.
  # High confidence, not flagged uncertain.
  # ---------------------------------------------------------------------
  - id: sb-validator-sensitive-01
    domain: support_saas
    principal: acme_analyst
    request: "Show escalations by customer email for last month."
    policy_version: v7
    surface_versions: {manifest: v7, grammar: v7, validator: v6, compiler: v7, database: v7, release: v7}
    mutation: validator_omits_sensitive_column
    semantic_query: {metric: escalated_tickets, dimensions: [customer_email], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: over_permissive
    expected_localized_surface: validator

  - id: sb-validator-sensitive-02
    domain: support_saas
    principal: acme_analyst
    request: "Show net revenue by customer email for last month."
    policy_version: v7
    surface_versions: {manifest: v7, grammar: v7, validator: v6, compiler: v7, database: v7, release: v7}
    mutation: validator_omits_sensitive_column
    semantic_query: {metric: net_revenue, dimensions: [customer_email], time_range: last_month, grain: month, limit: 100}
