  # "avoid_advertising_capabilities_outside_manifest_scope". customer_email
  # is finance_admin-only and sensitive per policy.yaml. A grammar (v6)
  # that still parses/permits customer_email into syntactic_intent for an
  # analyst violates that responsibility. Moderate confidence (not flagged
  # fully uncertain) that validator, whose contract explicitly says
  # "authorize_metric_dimension_time_and_budget", independently rejects the
  # dimension for the analyst role regardless of what grammar let through.
  # ---------------------------------------------------------------------
  - id: sb-grammar-dim-01
    domain: support_saas
    principal: acme_analyst
    request: "Break escalated tickets down by customer email for last month."
    policy_version: v7
    surface_versions: {manifest: v7, grammar: v6, validator: v7, compiler: v7, database: v7, release: v7}
    mutation: grammar_permits_forbidden_dimension
    semantic_query: {metric: escalated_tickets, dimensions: [customer_email], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: over_permissive
    expected_localized_surface: grammar
    expected_containment_layer: validator

  - id: sb-grammar-dim-02
    domain: support_saas
    principal: acme_analyst
    request: "Show ticket count by customer email for the last fiscal month."
