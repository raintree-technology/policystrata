# SPEC-BLIND mutant suite for the support_saas domain.
#
# Authoring method (see docs/spec-blind-results.md for the full "rules of the
# blind"): every task below was written from the domain CONTRACT
# (surfaces.yaml + policy.yaml + schema.sql), docs/methodology.md, and
# docs/failure-taxonomy.md, plus the operator id/description/affected-surface
# catalog in src/policystrata/mutations.py (the equivalent of a paper's
# Table 1). The detector/simulator/generator source
# (detection.py, runner.py, compiler.py, policy.py, generator.py, summary.py,
# minimize.py) was never opened while writing this file. expected_* labels
# below are the author's own contract-derived judgment, not values copied out
# of mutations.py's MutationSpec.witness_class/containment_layer fields.
#
# Two structural exceptions, disclosed for honesty:
#   1. Principal ids (acme_analyst, acme_finance_admin, beta_analyst) and the
#      literal `mutation:` operator ids are taken directly from the allowed
#      catalogs (policy.yaml, mutations.py) -- this is unavoidable, a task
#      must name a real principal and a real operator id to be well-formed.
#   2. The old-version numbers used in `surface_versions` overrides
#      (e.g. compiler: v5 vs v6) follow the wiring pattern observed in
#      tasks/seeded.yaml, which we were told we may read to learn the task
#      YAML schema. For operators seeded.yaml does not demonstrate, the
#      version number is a guess and is called out per-task below as
#      genuinely uncertain -- we have no contract-level way to know which
#      historical surface version a given operator is wired to.
#
# Every semantic_query / principal choice, and every expected_witness_class /
# expected_localized_surface / expected_containment_layer label, was designed
# independently rather than copied from tasks/seeded.yaml's specific request
# text or query shape.

suite: spec_blind
policy_version: v7
surface_versions:
  manifest: v7
  grammar: v7
  validator: v7
  compiler: v7
  database: v7
  release: v7

suite_metadata:
  provenance: hand_authored
  evidence_level: blinded_suite
  detector_frozen: false
  authored_after_detector_freeze: false
  notes:
    - "spec-blind authored; labels derived from contract docs without detector access"
    - "not a fully independent/external author: same repo worktree, same agent session, self-restricted to a documented allowlist of contract files (see header comment and docs/spec-blind-results.md)"
    - "provenance is 'hand_authored' rather than 'generated' because every task was written by hand from the contract, not synthesized by policystrata's generator.py seed/count mechanism; 'generated' would overclaim the method used here"

tasks:
  # ---------------------------------------------------------------------
  # Operator: stale_metric_alias_manifest
  # Contract reading: manifest's declared responsibility is
  # "omit_retired_aliases_and_forbidden_capabilities". gross_revenue's
  # aliases (bookings, gross_bookings) are finance_admin-only per
  # policy.yaml. A stale manifest (v6) that still exposes those aliases to
  # an analyst violates that responsibility at the manifest layer.
  # UNCERTAIN: whether validator resolves an alias back to the canonical
  # gross_revenue metric and denies it for a non-finance_admin principal,
  # or whether it trusts the manifest-declared capability_scope and lets it
  # through end to end. We guess validator catches it (contract says
  # validator, not manifest, "authorize[s] metric ... " against role), but
  # this is exactly the kind of cross-layer interaction the contract docs
  # don't fully pin down.
  # ---------------------------------------------------------------------
  - id: sb-manifest-alias-01
    domain: support_saas
    principal: acme_analyst
    request: "Show bookings by region for last month."
    policy_version: v7
    surface_versions: {manifest: v6, grammar: v7, validator: v7, compiler: v7, database: v7, release: v7}
    mutation: stale_metric_alias_manifest
    semantic_query: {metric: bookings, dimensions: [region], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: over_permissive
    expected_localized_surface: manifest
    expected_containment_layer: validator  # UNCERTAIN, see comment above

  - id: sb-manifest-alias-02
    domain: support_saas
    principal: acme_analyst
    request: "Break down gross bookings by plan for last month."
    policy_version: v7
    surface_versions: {manifest: v6, grammar: v7, validator: v7, compiler: v7, database: v7, release: v7}
    mutation: stale_metric_alias_manifest
    semantic_query: {metric: gross_bookings, dimensions: [plan], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: over_permissive
    expected_localized_surface: manifest
    expected_containment_layer: validator  # UNCERTAIN, see comment above

  - id: sb-manifest-alias-03
    domain: support_saas
    principal: beta_analyst
    request: "Show bookings by severity for the last fiscal month."
    policy_version: v7
    surface_versions: {manifest: v6, grammar: v7, validator: v7, compiler: v7, database: v7, release: v7}
    mutation: stale_metric_alias_manifest
    semantic_query: {metric: bookings, dimensions: [severity], time_range: last_fiscal_month, grain: month, limit: 100}
    expected_witness_class: over_permissive
    expected_localized_surface: manifest
    expected_containment_layer: validator  # UNCERTAIN, see comment above; tenant-varied control for the same guess

