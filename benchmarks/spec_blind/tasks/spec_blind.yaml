    expected_localized_surface: validator

  # ---------------------------------------------------------------------
  # Operator: compiler_drops_tenant_predicate
  # Contract reading: compiler's job is "preserve_tenant_scope_predicates".
  # Dropping it is a lowering_violation localized at compiler. But
  # schema.sql shows tenant isolation is *also* enforced independently by
  # Postgres RLS keyed on current_setting('app.tenant_id'), which does not
  # depend on the app's own WHERE-clause predicate. RLS wraps every query
  # regardless of what SQL the compiler wrote, so the database layer
  # should still contain the row-level exposure even though the compiler
  # violated its transition obligation. This is the worked example in
  # docs/failure-taxonomy.md almost verbatim. High confidence.
  # ---------------------------------------------------------------------
  - id: sb-compiler-droptenant-01
    domain: support_saas
    principal: acme_analyst
    request: "Show ticket count by region for my tenant, last month."
    policy_version: v7
    surface_versions: {manifest: v7, grammar: v7, validator: v7, compiler: v5, database: v7, release: v7}
    mutation: compiler_drops_tenant_predicate
    semantic_query: {metric: ticket_count, dimensions: [region], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: lowering_violation
    expected_localized_surface: compiler
    expected_containment_layer: database

  - id: sb-compiler-droptenant-02
    domain: support_saas
    principal: acme_analyst
    request: "Show escalations by plan for last month."
    policy_version: v7
    surface_versions: {manifest: v7, grammar: v7, validator: v7, compiler: v5, database: v7, release: v7}
    mutation: compiler_drops_tenant_predicate
    semantic_query: {metric: escalated_tickets, dimensions: [plan], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: lowering_violation
    expected_localized_surface: compiler
    expected_containment_layer: database

  - id: sb-compiler-droptenant-03
    domain: support_saas
    principal: beta_analyst
    request: "Show net revenue by severity for last month."
    policy_version: v7
    surface_versions: {manifest: v7, grammar: v7, validator: v7, compiler: v5, database: v7, release: v7}
    mutation: compiler_drops_tenant_predicate
    semantic_query: {metric: net_revenue, dimensions: [severity], time_range: last_month, grain: month, limit: 100}
    expected_witness_class: lowering_violation
    expected_localized_surface: compiler
    expected_containment_layer: database

